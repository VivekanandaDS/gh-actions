name: Artifacts Demo

on:
  workflow_dispatch:

jobs:
  build:
    name: Build job (create artifact)
    runs-on: ubuntu-latest

    steps:
      - name: Create build output
        run: |
          mkdir -p build
          echo "Hello from build job" > build/message.txt
          echo "Build time: $(date)" > build/time.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 3

  consume:
    name: Consume job (download artifact)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: downloaded

      - name: Verify downloaded files
        run: |
          echo "Listing downloaded files:"
          ls -R downloaded

          echo ""
          echo "File contents:"
          cat downloaded/message.txt
          cat downloaded/time.txt
